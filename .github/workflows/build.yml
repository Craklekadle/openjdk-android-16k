name: Build OpenJDK 21 for Android (16 KB pages)

on:
  push:
  workflow_dispatch:

jobs:
  build_android:
    strategy:
      matrix:
        arch: ["aarch32", "aarch64", "x86_64"]
        version: [21]
      fail-fast: false

    name: "Build Java ${{ matrix.version }} for Android ${{matrix.arch}}"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: set up JDK 1.${{ matrix.version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.version }}
          distribution: temurin

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt -y install autoconf python3 python-is-python3 unzip zip systemtap-sdt-dev libxtst-dev libasound2-dev libelf-dev libfontconfig1-dev libx11-dev libxext-dev libxrandr-dev libxrender-dev libxtst-dev libxt-dev

      - name: Build with CI build script
        run: export TARGET_VERSION=${{ matrix.version }} && bash "1_ci_build_arch_${{matrix.arch}}.sh"

      - name: Check the 16 KB page alignment
        if: matrix.arch != 'aarch32'
        run: |
          mkdir -p aligncheck && tar -xJf jre${{ matrix.version }}-android*.tar.xz -C aligncheck
          bad=0
          for f in $(find aligncheck -name '*.so'); do
            for a in $(readelf -lW "$f" | awk '$1=="LOAD"{print $NF}'); do
              if [ "$a" != "0x4000" ]; then echo "not 16 KB aligned: $f ($a)"; bad=1; fi
            done
          done
          exit $bad

      - name: Upload JDK build output
        uses: actions/upload-artifact@v4
        with:
          name: "jdk${{ matrix.version }}-${{matrix.arch}}"
          path: jdk${{ matrix.version }}-android*.tar.xz

      - name: Upload JRE build output
        uses: actions/upload-artifact@v4
        with:
          name: "jre${{ matrix.version }}-${{matrix.arch}}"
          path: jre${{ matrix.version }}-android*.tar.xz

      - name: Upload JRE debuginfo build output
        uses: actions/upload-artifact@v4
        with:
          name: "jre${{ matrix.version }}-debuginfo-${{matrix.arch}}"
          path: dizout
